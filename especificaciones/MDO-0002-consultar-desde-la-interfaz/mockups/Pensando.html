<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bot-W · Pensando</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0}
a{color:#00737a}a:hover{color:#005a60}
.bw-blob{animation:bw-drift 16s ease-in-out infinite alternate}
.bw-blob-b{animation-duration:21s;animation-delay:-6s}
@keyframes bw-drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-50px) scale(1.12)}100%{transform:translate(-40px,40px) scale(0.95)}}
.bw-spin-rapido{animation:bw-spin 2.2s linear infinite}
.bw-ring{animation:bw-spin 10s linear infinite}
@keyframes bw-spin{to{transform:rotate(360deg)}}
.bw-pulse{animation:bw-pulse 2.4s cubic-bezier(.32,.72,0,1) infinite}
.bw-pulse-2{animation-delay:1.2s}
@keyframes bw-pulse{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.9);opacity:0}}
.bw-shimmer{background:linear-gradient(90deg,rgba(20,22,26,.06) 0%,rgba(0,177,187,.22) 40%,rgba(255,105,0,.18) 60%,rgba(20,22,26,.06) 100%);background-size:300% 100%;animation:bw-shimmer 1.8s linear infinite}
@keyframes bw-shimmer{from{background-position:100% 0}to{background-position:-200% 0}}
.bw-dot{animation:bw-dot 1.2s ease-in-out infinite}
.bw-dot-2{animation-delay:.15s}
.bw-dot-3{animation-delay:.3s}
@keyframes bw-dot{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.bw-blob,.bw-spin-rapido,.bw-ring,.bw-pulse,.bw-shimmer,.bw-dot{animation:none}}
</style>
</head>
<body>
<div style="position: relative; min-height: 900px; overflow: hidden; background: #f6f7fb; font-family: 'Geist', 'Geist Variable', system-ui, sans-serif; color: #14161a; display: flex; flex-direction: column">
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
    <div class="bw-blob" style="position: absolute; left: -10%; top: -20%; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle, rgba(0,177,187,.4) 0%, rgba(0,177,187,0) 70%); filter: blur(40px)"></div>
    <div class="bw-blob bw-blob-b" style="position: absolute; right: -12%; bottom: -10%; width: 680px; height: 680px; border-radius: 50%; background: radial-gradient(circle, rgba(255,105,0,.3) 0%, rgba(255,105,0,0) 70%); filter: blur(40px)"></div>
    <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(20,22,26,.07) 1px, transparent 1px); background-size: 28px 28px"></div>
  </div>

  <header style="position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 32px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(from 200deg, #00b1bb, #2fd3c9 25%, #ff6900 55%, #5f259f 75%, #00b1bb); box-shadow: inset 0 0 0 1px rgba(255,255,255,.5)"></div>
      <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.02em">Bot<span style="color: #00737a">-W</span></span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #4d5463; padding: 3px 8px; border: 1px solid rgba(20,22,26,.12); border-radius: 999px; background: rgba(255,255,255,.6)">ASESORES · BANCO W</span>
    </div>
    <a href="#" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #14161a; background: rgba(255,255,255,.7); border: 1px solid rgba(20,22,26,.1)">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Nueva consulta
    </a>
  </header>

  <main style="position: relative; flex: 1; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px; padding: 32px 24px">
    <div style="align-self: flex-end; max-width: 80%; padding: 14px 18px; border-radius: 20px 20px 6px 20px; background: #14161a; color: #f6f7fb; font-size: 16px; line-height: 1.5">¿Cuáles son los requisitos y el monto máximo del Crédito Productivo Impulso?</div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 24px; padding-top: 24px">
      <div style="position: relative; width: 160px; height: 160px; display: grid; place-items: center">
        <div class="bw-pulse" aria-hidden="true" style="position: absolute; inset: 30px; border-radius: 50%; border: 1.5px solid rgba(0,177,187,.6)"></div>
        <div class="bw-pulse bw-pulse-2" aria-hidden="true" style="position: absolute; inset: 30px; border-radius: 50%; border: 1.5px solid rgba(255,105,0,.45)"></div>
        <div class="bw-ring" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid transparent; border-top-color: #00b1bb; border-right-color: rgba(255,105,0,.5)"></div>
        <div aria-hidden="true" style="position: absolute; inset: 30px; border-radius: 50%; background: radial-gradient(circle, rgba(0,177,187,.5), rgba(95,37,159,0) 70%); filter: blur(18px)"></div>
        <div aria-hidden="true" style="position: relative; width: 100px; height: 100px; border-radius: 50%; overflow: hidden; isolation: isolate; box-shadow: 0 18px 44px -14px rgba(0,120,130,.55)">
          <div class="bw-spin-rapido" style="position: absolute; inset: -30%; background: conic-gradient(from 0deg, #00b1bb 0%, #2fd3c9 22%, #ffb36b 40%, #ff6900 55%, #5f259f 70%, #00b1bb 84%); filter: blur(12px)"></div>
          <div style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.9), rgba(255,255,255,0) 42%)"></div>
        </div>
      </div>
      <p role="status" style="margin: 0; display: inline-flex; align-items: center; gap: 10px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; color: #00737a">
        BUSCANDO EN LA BASE DOCUMENTAL
        <span aria-hidden="true" style="display: inline-flex; gap: 4px">
          <span class="bw-dot" style="width: 5px; height: 5px; border-radius: 50%; background: #00737a"></span>
          <span class="bw-dot bw-dot-2" style="width: 5px; height: 5px; border-radius: 50%; background: #00b1bb"></span>
          <span class="bw-dot bw-dot-3" style="width: 5px; height: 5px; border-radius: 50%; background: #c24f00"></span>
        </span>
      </p>
      <div aria-hidden="true" style="width: 100%; display: flex; flex-direction: column; gap: 12px; padding: 24px; box-sizing: border-box; border-radius: 20px; background: rgba(255,255,255,.6); border: 1px solid rgba(20,22,26,.07)">
        <div class="bw-shimmer" style="height: 12px; width: 92%; border-radius: 6px"></div>
        <div class="bw-shimmer" style="height: 12px; width: 78%; border-radius: 6px"></div>
        <div class="bw-shimmer" style="height: 12px; width: 85%; border-radius: 6px"></div>
        <div class="bw-shimmer" style="height: 12px; width: 40%; border-radius: 6px"></div>
      </div>
    </div>
  </main>

  <div style="position: relative; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: 0 24px 32px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 22px; border-radius: 999px; background: rgba(255,255,255,.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(20,22,26,.08)">
      <label for="consulta-pensando" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tu consulta</label>
      <input id="consulta-pensando" type="text" disabled placeholder="Bot-W está respondiendo…" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 16px; color: #4d5463">
      <button type="button" aria-label="Detener respuesta" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #14161a; color: #fff; display: grid; place-items: center; cursor: pointer">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
    </div>
  </div>
</div>
</body>
</html>
