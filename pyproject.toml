[project]
name = "asistente-asesores"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.161.1",
    "fastembed==0.9.0",
    "google-genai==2.33.0",
    "py-rust-stemmers==0.1.8",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
    "eval: evals EV-1..EV-5 con el modelo real de embeddings (descarga ~0,22 GB la primera vez); excluir con -m \"not eval\"",
]

[tool.mypy]
strict = true
files = ["src"]

# py_rust_stemmers no trae stubs ni py.typed.
[[tool.mypy.overrides]]
module = "py_rust_stemmers"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["especificaciones"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
