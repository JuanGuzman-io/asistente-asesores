# Mandao configuration. Run `mandao sync` after editing. Schema: docs/schemas.md
schema_version: 1
workspace: monorepo
default_profile: app
paths: { specs: especificaciones, constitution: constitucion, releases: docs/releases }
language:
  business: es
  technical: es
projects:
  - name: asistente-asesores
    path: .
    profile: ai
    gates:
      format: uv run ruff format --check .
      lint: uv run ruff check .
      typecheck: uv run mypy src
      test: uv run pytest
      build: none
      secrets: git ls-files -z | xargs -0 uvx --quiet --from detect-secrets detect-secrets-hook --baseline .secrets.baseline --exclude-files '(^|/)_log/'
      sast: uvx --quiet bandit -r src -q
      audit: uvx --quiet pip-audit --path .venv/lib/python3.13/site-packages $(grep -v '^#' .pip-audit-ignore | sed 's/^/--ignore-vuln /')
  - name: web
    path: src/web
    profile: app
harnesses:
  - claude
session: { cut_min_savings: 50 }
