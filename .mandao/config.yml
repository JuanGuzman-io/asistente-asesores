# Mandao configuration. Run `mandao sync` after editing. Schema: docs/schemas.md
schema_version: 1
workspace: monorepo
default_profile: app
paths: { specs: especificaciones, constitution: constitucion, releases: docs/releases }
language:
  business: es
  technical: es
projects:
  - name: asistente-asesores
    path: .
    profile: ai
    gates:
      format: uv run ruff format --check .
      lint: uv run ruff check .
      typecheck: uv run mypy src
      test: uv run pytest
      build: none
      secrets: git ls-files -z --cached --others --exclude-standard | xargs -0 uvx --quiet --from detect-secrets detect-secrets-hook --baseline .secrets.baseline --exclude-files '(^|/)_log/'
      sast: uvx --quiet bandit -r src -q
      audit: uvx --quiet pip-audit --path .venv/lib/python3.13/site-packages $(grep -v '^#' .pip-audit-ignore | sed 's/^/--ignore-vuln /')
      # EV-1..EV-5 against the real embeddings model (PE 2026-10-23). Mandao has no `eval` gate name.
      metrics: uv run pytest -m eval
  - name: web
    path: src/web
    profile: app
    gates:
      format: npm run format:check
      lint: npm run lint
      typecheck: npm run typecheck
      test: npm test
      build: npm run build
      secrets: git ls-files -z --cached --others --exclude-standard | xargs -0 uvx --quiet --from detect-secrets detect-secrets-hook --baseline "$(git rev-parse --show-toplevel)/.secrets.baseline" --exclude-files '(^|/)_log/'
      audit: npm audit --omit=dev --audit-level=high
    tests:
      impacted: >-
        B=$PWD; cd "$(git rev-parse --show-toplevel)/src/web" && set -- {files} &&
        for f; do case $f in /*) ;; *) f=$B/$f ;; esac; set -- "$@" "$f"; shift; done &&
        npx vitest related "$@" --run --maxWorkers={workers}
harnesses:
  - claude
session: { cut_min_savings: 50 }
