<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Orbe de Bot-W con los colores de Banco W (turquesa, morado y naranja). -->
  <defs>
    <radialGradient id="color" cx="30%" cy="25%" r="90%">
      <stop offset="0" stop-color="#2fd3c9"/>
      <stop offset="0.5" stop-color="#00b1bb"/>
      <stop offset="0.8" stop-color="#ff6900"/>
      <stop offset="1" stop-color="#5f259f"/>
    </radialGradient>
    <radialGradient id="brillo" cx="34%" cy="28%" r="40%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="120" fill="url(#color)"/>
  <circle cx="128" cy="128" r="120" fill="url(#brillo)"/>
</svg>
